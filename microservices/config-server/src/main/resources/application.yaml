spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/orhangolcur/ecommerce-microservice.git
          default-label: dev
          search-paths: configs, configs/{application}
          clone-on-start: true
          force-pull: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8888
